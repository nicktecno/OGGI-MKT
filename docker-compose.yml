services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agregador
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agregador"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - ./apps/api/.env
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agregador
      # Mesmo valor que DATABASE_URL em Postgres local (Prisma exige `directUrl` no schema).
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@postgres:5432/agregador
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-local-dev-internal-secret-min-32-chars-long!!}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-agregador-auth-secret-32chars!}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
